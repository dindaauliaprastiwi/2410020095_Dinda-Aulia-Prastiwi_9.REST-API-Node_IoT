<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
    .card .unit { font-size: 18px; color: #aaa; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-on { background: #28a745; color: white; }
    .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; color: white; }
    .btn-off:hover { background: #c82333; }
    .btn-set { background: #667eea; color: white; }
    .btn-set:hover { background: #5568d3; }
    input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; width: 110px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
    tr:hover td { background: #f9f9f9; }
    #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    #log .error { color: #f66; }
    #log .info { color: #6af; }
    #alert-banner { display: none; background: #dc3545; color: white; padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 600; }
    .over { color: #dc3545 !important; }
  </style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API</h1>

  <div id="alert-banner"></div>

  <!-- Kartu Sensor -->
  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;" id="status">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
      <div class="unit" style="font-size:13px;">Batas suhu: <b id="th-now">--</b> °C</div>
    </div>
  </div>

  <!-- Grafik (Tugas 2) -->
  <div class="panel">
    <h2>📈 Grafik Real-time</h2>
    <canvas id="sensorChart" height="110"></canvas>
  </div>

  <!-- Threshold (Tugas 1) -->
  <div class="panel">
    <h2>🚨 Batas Suhu (Threshold)</h2>
    <div class="controls">
      <input type="number" id="th-input" step="0.1" placeholder="mis. 30">
      <button class="btn btn-set" onclick="setThreshold()">Simpan Batas</button>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="panel">
    <h2>💡 Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">💡 Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">🌑 Matikan Lampu</button>
    </div>
  </div>

  <!-- History -->
  <div class="panel">
    <h2>📋 10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body">
        <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>🖥️ Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ==============================
// KONFIGURASI
// ==============================
const API_BASE = 'http://localhost:1880/api';
const WS_URL   = 'ws://localhost:1880/ws/sensor';
const API_KEY  = 'rahasia123';            // harus sama dengan API_KEY di Node-RED
const MAX_POINTS = 30;
let lastUpdate = 0;

// ==============================
// UTILITY
// ==============================
function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// fetch dengan header X-API-Key (Tugas 3)
async function api(path, options = {}) {
  const headers = Object.assign({ 'X-API-Key': API_KEY }, options.headers || {});
  const res = await fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  const json = await res.json();
  if (res.status === 401) throw new Error('401 API key salah');
  return json;
}

function setBadge(on) {
  const b = document.getElementById('status-badge');
  b.textContent = on ? 'ONLINE' : 'OFFLINE';
  b.className = 'status-badge ' + (on ? 'status-online' : 'status-offline');
}

// ==============================
// CHART.JS (Tugas 2)
// ==============================
const chart = new Chart(document.getElementById('sensorChart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)',      data: [], borderColor: '#e74c3c', backgroundColor: '#e74c3c', tension: 0.3 },
      { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', backgroundColor: '#3498db', tension: 0.3 },
      { label: 'Batas Suhu',     data: [], borderColor: '#888', borderDash: [6, 6], pointRadius: 0 }
    ]
  },
  options: { animation: false, scales: { y: { beginAtZero: false } } }
});

function addChartPoint(d, th) {
  chart.data.labels.push(new Date(d.received).toLocaleTimeString());
  chart.data.datasets[0].data.push(d.suhu);
  chart.data.datasets[1].data.push(d.kelembaban);
  chart.data.datasets[2].data.push(th ? th.max : null);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }
  chart.update();
}

// ==============================
// UPDATE TAMPILAN (dipakai WebSocket & data awal)
// ==============================
function showSensor(d, th, over) {
  document.getElementById('suhu').textContent = d.suhu;
  document.getElementById('suhu').classList.toggle('over', !!over);
  document.getElementById('kelembaban').textContent = d.kelembaban;
  if (th) document.getElementById('th-now').textContent = th.max;
  lastUpdate = Date.now();
  setBadge(true);
}

function prependHistoryRow(d) {
  const tb = document.getElementById('history-body');
  if (tb.querySelector('td[colspan]')) tb.innerHTML = '';
  tb.insertAdjacentHTML('afterbegin',
    `<tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`);
  while (tb.rows.length > 10) tb.deleteRow(-1);
}

function showAlert(text) {
  log('⚠ ' + text, 'error');
  const el = document.getElementById('alert-banner');
  el.textContent = '⚠ ' + text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 8000);
}

// ==============================
// DATA AWAL (REST, hanya sekali)
// ==============================
async function loadInitial() {
  try {
    const s = await api('/suhu');
    if (s.status === 'success' && s.data.suhu !== null) showSensor(s.data, null, false);
  } catch (err) { log(`Gagal fetch sensor: ${err.message}`, 'error'); }

  try {
    const h = await api('/history');
    const tbody = document.getElementById('history-body');
    if (!h.data || h.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    } else {
      tbody.innerHTML = h.data.slice(-10).reverse().map(d => `
        <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
      h.data.slice(-MAX_POINTS).forEach(d => addChartPoint(d, null));
    }
  } catch (err) { log(`Gagal fetch history: ${err.message}`, 'error'); }

  try {
    const t = await api('/threshold');
    document.getElementById('th-now').textContent = t.data.max;
    document.getElementById('th-input').value = t.data.max;
  } catch (err) { log(`Gagal fetch threshold: ${err.message}`, 'error'); }
}

// ==============================
// THRESHOLD (PUT)
// ==============================
async function setThreshold() {
  const val = document.getElementById('th-input').value;
  try {
    const json = await api('/threshold', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ max: Number(val) })
    });
    if (json.status === 'success') {
      document.getElementById('th-now').textContent = json.data.max;
      log(`✓ Batas suhu diubah ke ${json.data.max}°C`, 'info');
    } else {
      log(`✗ Gagal: ${json.message}`, 'error');
    }
  } catch (err) { log(`✗ Error threshold: ${err.message}`, 'error'); }
}

// ==============================
// KONTROL LAMPU (POST)
// ==============================
async function kontrol(device, action) {
  try {
    const json = await api('/kontrol', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device, action })
    });
    if (json.status === 'success') log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
    else log(`✗ Gagal: ${json.message}`, 'error');
  } catch (err) { log(`✗ Error kontrol: ${err.message}`, 'error'); }
}

// ==============================
// WEBSOCKET (Tugas 4) — pengganti polling
// ==============================
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => log('WebSocket terhubung (tanpa polling)', 'info');
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'sensor') {
      showSensor(m.data, m.threshold, m.over);
      addChartPoint(m.data, m.threshold);
      prependHistoryRow(m.data);
    } else if (m.type === 'alert') {
      showAlert(m.message);
    }
  };
  ws.onclose = () => {
    setBadge(false);
    log('WebSocket terputus, mencoba lagi dalam 3 detik...', 'error');
    setTimeout(connectWS, 3000);
  };
}

// Status OFFLINE jika >10 detik tidak ada data
setInterval(() => { if (lastUpdate && Date.now() - lastUpdate > 10000) setBadge(false); }, 2000);

// ==============================
// START
// ==============================
log('Dashboard dimulai (REST untuk data awal, WebSocket untuk realtime)');
loadInitial();
connectWS();
</script>
</body>
</html>
